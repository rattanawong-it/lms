name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: lms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://lms:lms@localhost:5432/lms?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-32
      EMAIL_PROVIDER: smtp
      SMTP_URL: smtp://localhost:1025
      # M18 — e2e ซื้อคอร์สผ่านผู้ให้บริการจำลอง (next start เป็น production จึงต้องอนุญาต mock เอง)
      PAYMENT_PROVIDER: mock
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret-32chars
      ALLOW_MOCK_PAYMENT: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm exec prisma migrate deploy

      - run: pnpm db:seed

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
